[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsecops-sentinel"
version = "0.3.0"
description = "Pre-install scanner for dependency confusion and typosquatting risks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "packaging>=23.0",
    "aiohttp>=3.9",
    "jinja2>=3.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pyyaml>=6.0"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sentinel = ["data/*.txt", "dashboard/*.html", "reporting/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
