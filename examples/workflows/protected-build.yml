# Example for YOUR project (copy to .github/workflows/). The build job cannot start until the
# security gate passes, so `npm ci` / `pip install` never run for a blocked dependency set.
name: Build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: YOUR-ORG/devsecops-sentinel@v0.3.0   # replace with the repository/tag you publish
        with:
          path: .
          config: sentinel.toml
  build:
    needs: security-gate        # dependencies are installed only after the gate passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm test
