# Demonstrates the gate with a passing and a blocking scenario. Registry answers come from
# local fixtures (no network), so the outcome is deterministic.
name: Gate demo
on:
  workflow_dispatch:
    inputs:
      upload_sarif:
        description: Also upload SARIF to code scanning (needs code scanning to be available)
        type: boolean
        default: false
  push:
    paths:
      - "examples/**"
      - "action.yml"
      - ".github/workflows/demo.yml"
permissions:
  contents: read
jobs:
  gate-passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: gate
        uses: ./
        with:
          path: examples/clean-demo
          registry: "false"
          registry-fixture: examples/clean-demo/registry-fixture.json
          output-dir: sentinel-reports-clean
          artifact-name: sentinel-reports-clean
      - name: Assert the gate passed (exit code 0)
        env:
          CODE: ${{ steps.gate.outputs.exit-code }}
        run: test "$CODE" = "0"

  gate-blocks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: gate
        uses: ./
        continue-on-error: true
        with:
          path: examples/vulnerable-demo
          registry: "false"
          registry-fixture: examples/vulnerable-demo/registry-fixture.json
          output-dir: sentinel-reports-vulnerable
          artifact-name: sentinel-reports-vulnerable
      - name: Assert the gate blocked (policy exit code 1, not a scanner error)
        env:
          OUTCOME: ${{ steps.gate.outcome }}
          CODE: ${{ steps.gate.outputs.exit-code }}
        run: test "$OUTCOME" = "failure" && test "$CODE" = "1"

  sarif-upload:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_sarif }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./
        continue-on-error: true
        with:
          path: examples/vulnerable-demo
          registry: "false"
          registry-fixture: examples/vulnerable-demo/registry-fixture.json
          output-dir: sentinel-reports-sarif
          artifact-name: sentinel-reports-sarif
          upload-sarif: "true"
